# Identity catalog for the USCIS "Number of Service-wide Forms" report.
#
# This file is the single source of truth for "which printed rows are the same thing across years".
# The build fails on any row it cannot place, with a suggestion of what to add here.
#
# How a printed row is resolved:
#   1. The label is matched against `codes` (exact). If it is not a code, trailing digits are split off
#      ONLY when the rest is a code AND those digits are a footnote number declared in the same file
#      ("I-6007" -> I-600 + footnote 7; "I-13122" -> I-131 + footnote 22). Otherwise the build fails.
#   2. `label_aliases` maps old composite labels to a code ("N-600/600K" -> "N-600").
#   3. A code with one series resolves by code alone. A code with several series must match one of that
#      series' `descriptions` (compared case- and whitespace-insensitively). New descriptions fail the build.
#
# Category is display metadata only: FY2023Q1 misfiles "Other" forms under "Citizenship and Nationality".

codes = [
  "TOTAL", "G-325A",
  "I-90", "I-102", "I-129", "I-129F", "I-130", "I-131", "I-140", "I-193", "I-290B", "I-360", "I-485", "I-526",
  "I-526E", "I-539", "I-589", "I-600", "I-601A", "I-730", "I-751", "I-765", "I-800", "I-817", "I-821", "I-821D",
  "I-824", "I-829", "I-867", "I-870", "I-889", "I-881", "I-899", "I-914", "I-918", "I-924", "I-924A", "I-924/924A", "I-929", "I-941",
  "I-956", "I-956F", "I-956G", "I-956H", "I-956K",
  "N-300", "N-336", "N-400", "N-470", "N-565", "N-600", "N-644", "N-648",
  "Waivers", "Legalization", "DS-230", "EOIR Adjustment",
]

[label_aliases]
"Total - All Forms" = "TOTAL"
"TOTAL - ALL FORMS" = "TOTAL"
"N-600/600K" = "N-600"
"I-600/600A" = "I-600"
"I-800/800A" = "I-800"
"DS-230 (IV)" = "DS-230"
# FY2017Q1 prints "Waivers8" but defines only footnotes 1-7; footnote 7 is the waivers definition. Reviewed by hand.
"Waivers8" = "Waivers"

# ---------------------------------------------------------------- total
[[series]]
id = "total"
code = "TOTAL"
category = "All forms"
title = "All USCIS forms (service-wide total)"
note = "USCIS's own total line. It covers forms not listed individually, so it exceeds the sum of the rows."

