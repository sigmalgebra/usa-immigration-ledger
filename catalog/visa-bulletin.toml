# Visa Bulletin labels -> canonical ids. The single source of truth for which printed rows and columns are the
# same series across bulletins. Matching ignores case and runs of whitespace; everything else must be listed,
# typos included, so a new label fails the build instead of being guessed.
# Series id: vb/<chart>/<category>/<area>, e.g. vb/final/f4/philippines (chart is final | filing).

# Section titles that some 2003 bulletins print as a data row with values.
ignore = ["Employment-Based"]

[[category]]
id = "f1"
section = "family"
title = "F1"
description = "Unmarried sons and daughters (21 or older) of U.S. citizens"
printed = ["1st", "F1"]

[[category]]
id = "f2a"
section = "family"
title = "F2A"
description = "Spouses and children (under 21) of green card holders"
printed = ["2A", "2A*", "F2A", "F2A*"]

[[category]]
id = "f2b"
section = "family"
title = "F2B"
description = "Unmarried sons and daughters (21 or older) of green card holders"
printed = ["2B", "F2B"]

[[category]]
id = "f3"
section = "family"
title = "F3"
description = "Married sons and daughters of U.S. citizens"
printed = ["3rd", "F3"]

[[category]]
id = "f4"
section = "family"
title = "F4"
description = "Brothers and sisters of adult U.S. citizens"
printed = ["4th", "F4", "4rd"]

