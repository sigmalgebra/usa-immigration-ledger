# Hand-verified values. Each pin was read by a person straight from the archived file at the named cell
# (Excel: Sheet!A1; CSV: 1-based line number and column letter), not through our parser.
# test_pipeline.py re-reads the raw cell independently AND checks that the ledger holds the same value at the same cell.
# One pin per layout era at least: FY2013 four-quarter CSV, FY2019 CSV, FY2019-FY2021 PDF, FY2021Q4 CSV,
# FY2022-23 CSV, FY2024 fractional XLSX, FY2026 XLSX, I-130 awaiting, State Dept XLSX and PDF.
# PDF pins can't be re-read by cell without our own position logic, so the test instead checks that `pdf_text`
# appears on that page in plain text extraction, which is independent of how we rebuild the table.

