name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Tests (hand-verified pins, parsers, determinism)
        run: python -m pytest
      - name: Committed data matches a fresh build
        run: PYTHONPATH=pipeline python -m usdata build --check

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build (fails if any cited number is missing from the data)
        run: npm run build
